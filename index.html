<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
    }
</style>
</head>

<body>

<canvas id="heart"></canvas>

<script>

const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

let width;
let height;
let points = [];

const TEXT = "I love you";

// Number of words around the heart
const AMOUNT = 80;

// Change this to make the text bigger/smaller
const TEXT_SIZE = 11;

function heart(t) {
    return {
        x: 16 * Math.pow(Math.sin(t), 3),

        y:
            13 * Math.cos(t) -
            5 * Math.cos(2 * t) -
            2 * Math.cos(3 * t) -
            Math.cos(4 * t)
    };
}

function resize() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    createHeart();
}

function createHeart() {

    points = [];

    for (let i = 0; i < AMOUNT; i++) {

        /*
        Spread the words evenly around
        the OUTLINE of the heart.
        */

        const t =
            (i / AMOUNT) *
            Math.PI *
            2;

        const p = heart(t);

        points.push({

            hx: p.x,
            hy: p.y,

            /*
            Words begin scattered
            around the screen.
            */

            startX:
                Math.random() *
                width,

            startY:
                Math.random() *
                height,

            /*
            Makes them arrive at
            slightly different times.
            */

            delay:
                Math.random() *
                1200,

            duration:
                700 +
                Math.random() *
                900,

            brightness:
                Math.random()
        });
    }
}

function easeOutCubic(x) {

    return (
        1 -
        Math.pow(
            1 - x,
            3
        )
    );
}

let startTime =
    performance.now();

function animate(time) {

    // Clear screen

    ctx.fillStyle = "#000";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    const elapsed =
        time - startTime;

    /*
    HEART SIZE

    Change 35 to a SMALLER number
    to make the heart BIGGER.
    */

    const scale =
        Math.min(
            width / 35,
            height / 34
        );

    const centerX =
        width / 2;

    const centerY =
        height / 2;

    // --------------------
    // HEARTBEAT
    // --------------------

    let pulse = 1;

    if (elapsed > 2200) {

        const beat =
            Math.sin(
                elapsed *
                0.005
            );

        pulse =
            1 +
            Math.pow(
                Math.max(
                    0,
                    beat
                ),
                10
            ) *
            0.035;
    }

    // --------------------
    // TEXT
    // --------------------

    const fontSize =
        Math.max(
            8,
            Math.min(
                TEXT_SIZE,
                width * 0.027
            )
        );

    ctx.font =
        `bold ${fontSize}px Arial, sans-serif`;

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    // --------------------
    // DRAW HEART
    // --------------------

    for (
        const point
        of points
    ) {

        let progress =
            (
                elapsed -
                point.delay
            ) /
            point.duration;

        progress =
            Math.max(
                0,
                Math.min(
                    1,
                    progress
                )
            );

        const eased =
            easeOutCubic(
                progress
            );

        /*
        Because hx/hy are NOT
        multiplied by a random
        fill value, every word
        stays on the OUTSIDE edge.
        */

        const finalX =
            centerX +
            point.hx *
            scale *
            pulse;

        const finalY =
            centerY -
            point.hy *
            scale *
            pulse;

        // Fly towards heart

        const x =
            point.startX +
            (
                finalX -
                point.startX
            ) *
            eased;

        const y =
            point.startY +
            (
                finalY -
                point.startY
            ) *
            eased;

        // Fade in

        ctx.globalAlpha =
            progress;

        // Pink shades

        if (
            point.brightness >
            0.96
        ) {

            ctx.fillStyle =
                "#ffd4e8";

        }

        else if (
            point.brightness >
            0.75
        ) {

            ctx.fillStyle =
                "#ff82b8";

        }

        else {

            ctx.fillStyle =
                "#ff3f91";
        }

        ctx.fillText(
            TEXT,
            x,
            y
        );
    }

    ctx.globalAlpha = 1;

    requestAnimationFrame(
        animate
    );
}

// Resize support

window.addEventListener(
    "resize",
    resize
);

// Start

resize();

requestAnimationFrame(
    animate
);

</script>

</body>
</html>

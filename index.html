<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
    }
</style>
</head>

<body>

<canvas id="heart"></canvas>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

let width;
let height;
let points = [];

const TEXT = "I love you";
const AMOUNT = 1200;

function heart(t) {
    return {
        x: 16 * Math.pow(Math.sin(t), 3),
        y:
            13 * Math.cos(t) -
            5 * Math.cos(2 * t) -
            2 * Math.cos(3 * t) -
            Math.cos(4 * t)
    };
}

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    createHeart();
}

function createHeart() {
    points = [];

    for (let i = 0; i < AMOUNT; i++) {
        const t = Math.random() * Math.PI * 2;
        const p = heart(t);

        // Fills the inside of the heart
        const fill = Math.sqrt(Math.random());

        points.push({
            hx: p.x * fill,
            hy: p.y * fill,

            startX: Math.random() * width,
            startY: Math.random() * height,

            delay: Math.random() * 1400,
            duration: 700 + Math.random() * 900,

            brightness: Math.random()
        });
    }
}

function easeOutCubic(x) {
    return 1 - Math.pow(1 - x, 3);
}

let startTime = performance.now();

function animate(time) {

    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, width, height);

    const elapsed = time - startTime;

    // Makes heart large while still fitting phone screen
    const scale = Math.min(
        width / 36,
        height / 34
    );

    const centerX = width / 2;
    const centerY = height / 2;

    // Heartbeat
    let pulse = 1;

    if (elapsed > 2300) {
        const beat = Math.sin(elapsed * 0.005);

        pulse =
            1 +
            Math.pow(
                Math.max(0, beat),
                10
            ) * 0.04;
    }

    // Responsive text size
    const fontSize = Math.max(
        6,
        Math.min(width, height) * 0.013
    );

    ctx.font = `bold ${fontSize}px Arial, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    for (const point of points) {

        let progress =
            (elapsed - point.delay) /
            point.duration;

        progress = Math.max(
            0,
            Math.min(1, progress)
        );

        const eased = easeOutCubic(progress);

        const finalX =
            centerX +
            point.hx *
            scale *
            pulse;

        const finalY =
            centerY -
            point.hy *
            scale *
            pulse;

        const x =
            point.startX +
            (finalX - point.startX) *
            eased;

        const y =
            point.startY +
            (finalY - point.startY) *
            eased;

        ctx.globalAlpha = progress;

        if (point.brightness > 0.96) {
            ctx.fillStyle = "#ffffff";
        }
        else if (point.brightness > 0.80) {
            ctx.fillStyle = "#ff8fc1";
        }
        else {
            ctx.fillStyle = "#ff4f9a";
        }

        ctx.fillText(TEXT, x, y);
    }

    ctx.globalAlpha = 1;

    requestAnimationFrame(animate);
}

window.addEventListener("resize", resize);

resize();
requestAnimationFrame(animate);
</script>

</body>
</html>
